[package]
name = "downloader-xnxx"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"

[dependencies]
bytes = "1"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
dialoguer = { version = "0.11", default-features = false }
env_logger = "0.11"
futures = "0.3"
log = "0.4"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "gzip", "brotli", "http2"] }
scraper = "0.20"
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "time", "sync"] }
url = "2"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
